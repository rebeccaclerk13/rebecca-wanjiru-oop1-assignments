name: Compile assignment programs

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the assignment source code
        uses: actions/checkout@v4

      - name: Compile every C++ program
        shell: bash
        run: |
          set -euo pipefail
          for source_file in week1/*.cpp week2/*.cpp week3/*.cpp week4/*.cpp; do
            output_file="$(mktemp)"
            g++ -std=c++17 -Wall -Wextra -pedantic "$source_file" -o "$output_file"
            rm -f "$output_file"
          done

      - name: Compile every C program
        shell: bash
        run: |
          set -euo pipefail
          for source_file in image_assignments/*.c; do
            output_file="$(mktemp)"
            gcc -std=c11 -Wall -Wextra -pedantic "$source_file" -o "$output_file"
            rm -f "$output_file"
          done
